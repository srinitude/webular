[install]
# Minimum package version age, in seconds (one day). Very fresh releases stay out
# of installs, so a malicious release is usually pulled before it can land.
minimumReleaseAge = 86400

[test]
preload = ["./tests/_support/no-cache.ts", "./tests/_support/first-spawn.ts"]
# This test imports the site's own packages, which only `mise run site:build`
# installs; `mise run site:test` runs it by name, after that install.
pathIgnorePatterns = ["tests/quality/site-copy-failed.test.ts"]
