# webular plugin — remote CI. One job runs the plugin chain on Linux, macOS and Windows:
# mise run plugin:ci pulls lint -> typecheck -> six checks -> test -> ci.
# mise owns the toolchain + graph, so tool versions come from mise.toml.
name: Plugin

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One commit, one plugin run: a push to a branch with an open pull request
  # into main is already checked by that pull request's run (same head
  # commit). Any lookup failure leaves `covered` false, so the matrix runs.
  push-covered-by-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      covered: ${{ steps.lookup.outputs.covered }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --base main --state open --json number --jq length || echo 0)
          echo "covered=$([ "${n:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  plugin:
    needs: push-covered-by-pr
    if: ${{ !cancelled() && needs.push-covered-by-pr.outputs.covered != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15 # above the ci.yml ceiling of 11; tighten from measured run times
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      # Bun's package cache, keyed on the exact lockfile + toolchain, as in
      # ci.yml. `bun install --frozen-lockfile` still runs and verifies it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      - name: Run the plugin chain
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: mise run plugin:ci
