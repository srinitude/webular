# webular — dead-code pruning. Every pull request and a weekly schedule run
# `mise run prune:check`; a failing scheduled run opens a draft pull request
# with the result of `mise run prune:fix`, never a push to main.
name: Prune

on:
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: prune-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MISE_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      - name: Trust the repo's mise.toml
        run: mise trust
      - name: Check for dead code
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: env -u MISE_TASK_SKIP mise run prune:check

  # Scheduled and manual runs only: a pull request never reaches this job, so
  # no fork code runs with a write token. The checkout drops its token; the
  # push below passes the default token for that one command.
  fix:
    needs: check
    if: always() && needs.check.result == 'failure' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      MISE_LOCKED: 1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRUNE_BRANCH: prune/auto-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      - name: Trust the repo's mise.toml
        run: mise trust
      - name: Remove dead code
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: env -u MISE_TASK_SKIP mise run prune:fix
      - name: Commit, push the branch, and open a draft pull request
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "prune:fix changed nothing; no pull request."
            exit 0
          fi
          git switch -c "$PRUNE_BRANCH"
          git add -A
          git -c user.name='Kiren Srinivasan' -c user.email='kiren@fantasymetals.com' \
            commit -m 'chore: prune dead code'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${PRUNE_BRANCH}"
          gh pr create --draft --base main --head "$PRUNE_BRANCH" \
            --title 'chore: prune dead code' \
            --body 'Opened by the Prune workflow: `mise run prune:check` failed, and `mise run prune:fix` produced this change. Review before merging.'
