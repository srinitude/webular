# webular — remote CI/CD. Single default dependency path: `mise run ci`
# pulls setup -> format -> lint -> typecheck -> build -> test -> validate -> ci.
# Identical to local CI (`mise run ci`); mise owns the toolchain + graph.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      - name: Run the single CI dependency path
        run: mise run ci
