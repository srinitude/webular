# webular — remote CI/CD. Single default dependency path: `mise run ci`
# pulls setup -> format -> lint -> typecheck -> build -> test -> validate -> ci.
# Identical to local CI (`mise run ci`); mise owns the toolchain + graph.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          experimental: true
      - name: Run the single CI dependency path
        run: mise run ci
