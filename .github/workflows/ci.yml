# webular — remote CI/CD. Single default dependency path: `mise run ci`
# pulls setup -> lint -> typecheck -> build -> test -> validate -> ci.
# Identical to local CI (`mise run ci`); mise owns the toolchain + graph, so
# tool versions come from mise.toml, never from this file.
# Runs on Linux, macOS and Windows: the CLI ships to all three.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      - name: Run the single CI dependency path
        run: mise run ci
