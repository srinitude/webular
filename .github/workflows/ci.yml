# webular — remote CI/CD. Single default dependency path: `mise run ci`
# pulls setup -> lint -> typecheck -> build -> test -> validate -> ci.
# Identical to local CI (`mise run ci`); mise owns the toolchain + graph, so
# tool versions come from mise.toml, never from this file.
# Runs on every OS the CLI ships to: Linux, macOS and Windows on x64 and arm64,
# plus Alpine (musl) in a container.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One commit, one CI run: a push to a branch with an open pull request into
  # main is already checked by that pull request's run (same head commit,
  # merged onto main). Every other push runs the full matrix. A pull request
  # with merge conflicts gets no pull_request run, so it covers nothing; while
  # GitHub still reports UNKNOWN, the lookup waits up to 30 seconds. Any lookup
  # failure or other state leaves `covered` false, so the matrix runs.
  push-covered-by-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      covered: ${{ steps.lookup.outputs.covered }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in 1 2 3 4 5 6; do
            s=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --base main --state open --json mergeable --jq '.[0].mergeable // "NONE"' || echo NONE)
            [ "$s" = UNKNOWN ] || break
            sleep 5
          done
          echo "covered=$([ "$s" = MERGEABLE ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  ci:
    needs: push-covered-by-pr
    if: ${{ !cancelled() && needs.push-covered-by-pr.outputs.covered != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # timeout = about 1.6x the job's measured time with the full suite
        # (1147 tests in 206 files): Windows 7.1 min, Ubuntu about 6.3 min,
        # macOS about 6.7 min. Measured in run 39657398809; Ubuntu and macOS
        # are projected from 180 and 174 files done in 4 and 5 min.
        # locked: mise.lock lists linux-x64, macos-arm64, windows-x64 and
        # linux-x64-musl only, so a locked install fails on the other platforms
        # until `mise lock --platform macos-x64,linux-arm64,windows-arm64` runs.
        include:
          - os: ubuntu-latest
            timeout: 10
            locked: 1
          - os: ubuntu-24.04-arm
            timeout: 12
            locked: 0
          - os: macos-latest # arm64
            timeout: 11
            locked: 1
          # The x64 Mac is the slowest runner, so its tests run in two shards
          # on two runners: shard 1/2 runs the whole `mise run ci` spine, and
          # shard 2/2 runs setup, build, the other half of the files, and e2e,
          # so the two shards take about the same time.
          # `bun test --shard` splits the file list, so each test file runs
          # exactly once on this OS (tests/ci/workflow-matrix.test.ts checks
          # that the shards are 1..n of n).
          - os: macos-15-intel # x64; macos-13 is retired
            timeout: 14
            locked: 0
            shard: 1/2
          - os: macos-15-intel
            timeout: 14
            locked: 0
            shard: 2/2
          # Both Windows runners were the slowest jobs (about 7 min each, in
          # run 39947552969), so they split the same way as the x64 Mac.
          - os: windows-latest
            timeout: 11
            locked: 1
            shard: 1/2
          - os: windows-latest
            timeout: 11
            locked: 1
            shard: 2/2
          - os: windows-11-arm
            timeout: 15
            locked: 0
            shard: 1/2
          - os: windows-11-arm
            timeout: 15
            locked: 0
            shard: 2/2
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      MISE_LOCKED: ${{ matrix.locked }}
      # Empty on unsharded runners, so `mise run test` runs every file there.
      WEBULAR_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      # Bun's package cache (tarballs), keyed on the exact lockfile + toolchain.
      # `bun install --frozen-lockfile` still runs and verifies every package.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      # Trust is stored under HOME, so it reaches child processes that start
      # with a minimal environment (the MCP stdio tests run `mise tasks ls`).
      - name: Trust the repo's mise.toml
        run: mise trust
      # The completions test parses webular.fish with fish; the Ubuntu image
      # has it, the macOS image does not.
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install fish
      # The manpage test lints webular.1 with mandoc; macOS ships it, Ubuntu does not.
      - name: Install mandoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mandoc
      - name: Run the single CI dependency path
        if: matrix.shard != '2/2'
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: mise run ci
      # Every command, flag, MCP tool, and the executable, from the user's
      # side, against a local fixture server (no network).
      # Sharded runners run it in shard 2/2, after that shard's build.
      - name: Run the end-to-end surface check
        if: ${{ !matrix.shard }}
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: mise run e2e
      # Shard 2/2: the build the tests read, this shard's test files, then
      # e2e on that build. Lint, typecheck, and the bug checks run once, in
      # shard 1/2. One `&&` chain, so the first failure fails the step in both
      # bash and the Windows PowerShell default shell.
      - name: Run the second test shard
        if: matrix.shard == '2/2'
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          MISE_TASK_SKIP_DEPENDS: "1"
        run: mise run setup && mise run build && mise run test && mise run e2e

  # musl: the same suite on Alpine, where the linux-*-musl executables run.
  # A docker run on the host (not a job container), because the JavaScript
  # actions need glibc node and checkout stays on the host. The image ships no
  # bash, curl, or npm, and its `node` is a bun symlink that fails
  # `node --version`; the doctor, completion, PKGBUILD, installer, and
  # platform package tests need the real tools, as on every other runner.
  # --init makes docker's init PID 1, which reaps orphaned grandchildren.
  alpine:
    needs: push-covered-by-pr
    if: ${{ !cancelled() && needs.push-covered-by-pr.outputs.covered != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run mise run ci and mise run e2e on Alpine
        run: |
          docker run --init --rm -v "$PWD:/w" -w /w -e MISE_LOCKED=1 oven/bun:1.4.3-alpine@sha256:629e17411f1f129dbec3af78d5af9c9f2a937435c80349437206c6b0b7422373 sh -ec '
            apk add --no-cache git fish mandoc libgcc libstdc++ bash curl nodejs npm procps
            apk add --no-cache --repository=https://dl-cdn.alpinelinux.org/alpine/edge/community mise
            git config --global --add safe.directory /w
            mise trust
            MISE_EXPERIMENTAL=1 mise run ci
            MISE_EXPERIMENTAL=1 mise run e2e'

  # Standalone executable: each runner builds its native target (mise run
  # build) and smoke-tests it. Same 3-OS matrix and gate as ci; its timeouts fit
  # the build alone, which runs no test suite.
  executable:
    needs: push-covered-by-pr
    if: ${{ !cancelled() && needs.push-covered-by-pr.outputs.covered != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout: 4
          - os: macos-latest
            timeout: 5
          - os: windows-latest
            timeout: 11
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      MISE_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      - name: Build bundles and the native executable
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: mise run build
      - name: Smoke test the executable
        run: |
          ./dist/bin/webular --version
          ./dist/bin/webular --help
          ./dist/bin/webular diagram --json

  # webular.dev: build the site, then check every width from 320 to 2560 px in
  # both themes (no sideways scroll, tap targets, focus ring, axe, home weight).
  # The home screenshots at 390, 1024, and 1440 px are kept for a by-eye review.
  site:
    needs: push-covered-by-pr
    if: ${{ !cancelled() && needs.push-covered-by-pr.outputs.covered != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_LOCKED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock', 'site/bun.lock') }}
      - name: Trust the repo's mise.toml
        run: mise trust
      - name: Build the site
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: mise run site:build
      - name: Check the site at all 14 widths in both themes
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
          MISE_TASK_SKIP_DEPENDS: "1"
        run: mise run site:test
      - name: Upload the home screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-home-screenshots
          path: site/dist-shots/
          if-no-files-found: error

  # Nix flake: `nix build .#webular` fetches the release binary webular.nix
  # names for this runner's system, and the built bin/webular must report the
  # version in package.json. Runs on Linux (autoPatchelfHook path) and macOS.
  nix:
    needs: push-covered-by-pr
    if: ${{ !cancelled() && needs.push-covered-by-pr.outputs.covered != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Build the flake package
        run: nix build .#webular --print-build-logs
      - name: Run the built executable
        run: |
          out=$(./result/bin/webular --version)
          echo "$out"
          want=$(jq -r .version package.json)
          case "$out" in *"$want"*) ;; *) echo "::error::expected $want, got $out"; exit 1 ;; esac
