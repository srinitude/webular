# webular release: runs on a v* tag push.
# build-assets runs beside test and test-musl, so the cross-compiles stay off
# the critical path: cross-compile every TARGETS entry (src/core/platform.ts)
# with `mise run compile:all` as webular-<key>[.exe], write SHA256SUMS, generate
# the Homebrew formula and Scoop manifest from it (src/release/distribution.ts),
# write the winget manifest set (src/release/winget.ts) and upload it as the
# build artifact "winget-manifests" (submitting it to microsoft/winget-pkgs is
# a manual step), write an SPDX SBOM (anchore/sbom-action), and upload dist/bin
# as the run artifact "release-files". It has read-only permissions and changes
# nothing outside the run. test + test-musl + build-assets -> assets: download
# "release-files" (no rebuild, so the SHA256SUMS bytes hold), attest the SBOM,
# attest every file (actions/attest, Sigstore build provenance), and attach
# them all, plus scripts/install.sh and scripts/install.ps1, to a DRAFT GitHub
# release; nothing is attested or released until every test passes -> publish: one
# npm package per target (webular-<key>, with os/cpu/libc fields), then the
# root package that lists them as optionalDependencies, then un-draft the
# release. Immutable releases lock assets on publish, so the release goes
# public only after npm succeeds. Versions already on npm are skipped, so a
# rerun after a partial publish is safe. A prerelease tag (any tag with a "-")
# publishes to the npm dist-tag `next` and marks the release as a prerelease;
# a stable version below npm's current `latest` publishes to `maintenance` and
# never becomes the latest GitHub release (src/release/dist-tag.ts).
# Gates: the tag must point at a commit on main, its version must not be on npm
# yet (first attempt only, so a rerun can finish a partial publish), and the
# publish job runs in the GitHub environment `release`, whose protection rules
# guard the npm publish. -> homebrew, scoop: push webular.rb and webular.json
# to srinitude/homebrew-webular and srinitude/scoop-webular for a `latest`
# release; each skips with a notice while the TAP_TOKEN secret is unset.
# tests/core/platform-parity.test.ts keeps this file, mise.toml, and the
# resolver table in step; tests/release/gates.test.ts checks the gates.
# npm auth is trusted publishing (OIDC): no NPM_TOKEN. Before the first run, add
# a trusted publisher on npmjs.com for webular and for every webular-<key>
# package, with these form values: user srinitude, repo webular, workflow
# release.yml, environment release, and "npm publish" allowed (ticked).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time per tag; a running publish is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep equal to [tools] bun in mise.toml.
  BUN_VERSION: "1.4.3"

jobs:
  # The suite on every OS the CLI ships to (mise.lock lists only linux-x64,
  # macos-arm64, windows-x64 and linux-x64-musl, so the other platforms run
  # unlocked until `mise lock --platform macos-x64,linux-arm64,windows-arm64`).
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, locked: 1 }
          - { os: ubuntu-24.04-arm, locked: 0 }
          - { os: macos-latest, locked: 1 } # arm64
          - { os: macos-15-intel, locked: 0 } # x64; macos-13 is retired
          - { os: windows-latest, locked: 1 }
          - { os: windows-11-arm, locked: 0 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15 # the slowest runner (Windows arm64) with headroom
    env:
      MISE_LOCKED: ${{ matrix.locked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, so the main-ancestry check below can run
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      # The tag gates need one runner; they do not change per OS.
      - name: Tag must match package.json version
        if: matrix.os == 'ubuntu-latest'
        run: test "v$(jq -r .version package.json)" = "${GITHUB_REF_NAME}"
      - name: Tag must point at a commit on main
        if: matrix.os == 'ubuntu-latest'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1; }
      - name: Version must not be on npm yet
        if: matrix.os == 'ubuntu-latest' && github.run_attempt == 1 # a rerun may finish a partial publish
        run: |
          version=$(jq -r .version package.json)
          if [ -n "$(npm view "webular@$version" version 2>/dev/null)" ]; then
            echo "::error::webular@$version is already on npm; bump package.json and tag again"
            exit 1
          fi
      # The completions test parses webular.fish with fish; the manpage test
      # lints webular.1 with mandoc. Each is missing from one runner image.
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install fish
      - name: Install mandoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mandoc
      # mise.toml defines tasks.test (depends on setup -> lint -> typecheck -> build).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      - run: mise run test
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache

  # musl: the same suite on Alpine, where the linux-*-musl executables run
  # (docker run on the host: the JavaScript actions need glibc node). bash,
  # curl, nodejs, and npm: the image has none of them (its `node` is a bun
  # symlink), and the suite runs each one.
  test-musl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run mise run test on Alpine
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e MISE_LOCKED=1 oven/bun:1.4.3-alpine@sha256:629e17411f1f129dbec3af78d5af9c9f2a937435c80349437206c6b0b7422373 sh -ec '
            apk add --no-cache git fish mandoc libgcc libstdc++ bash curl nodejs npm procps
            apk add --no-cache --repository=https://dl-cdn.alpinelinux.org/alpine/edge/community mise
            git config --global --add safe.directory /w
            mise trust
            MISE_EXPERIMENTAL=1 mise run test'

  # No needs: it runs beside the tests. It only reads the repo and writes run
  # artifacts; the attestations and the draft release wait for the tests in
  # the assets job below.
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # eight cross-compiles after the lint, typecheck, and build chain
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      - name: Cross-compile every target
        run: mise run compile:all
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      # bun build --compile --sourcemap leaves a .map beside each executable; the
      # maps are not release files, so drop them before any webular-* glob.
      - name: Drop the source maps bun writes beside the executables
        run: rm -f dist/bin/*.map
      # The completions tarball is a release file: it exists before SHA256SUMS,
      # so the webular-* globs below checksum, attest, and upload it.
      - name: Stage shell completions and the webular(1) man page
        run: |
          mise run package:completions
          mise run package:man
          tar -czf dist/bin/webular-completions.tar.gz -C dist completions
          cp dist/man/webular.1 dist/bin/webular.1
        env:
          MISE_TASK_SKIP_DEPENDS: "1" # binaries exist above; skip compile:all
      - name: Checksum the executables
        run: (cd dist/bin && sha256sum webular-* > SHA256SUMS)
      - name: Write the Homebrew formula and Scoop manifest from SHA256SUMS
        run: mise run package:manifests
        env:
          MISE_TASK_SKIP_DEPENDS: "1" # binaries and SHA256SUMS exist above; skip compile:all
      - name: Write the winget manifests from SHA256SUMS
        run: mise run package:winget
        env:
          MISE_TASK_SKIP_DEPENDS: "1" # binaries and SHA256SUMS exist above; skip compile:all
      - name: Upload the winget manifests for a manual winget-pkgs submission
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: winget-manifests
          path: dist/bin/winget
          if-no-files-found: error
      - name: Stage the installers
        run: cp scripts/install.sh scripts/install.ps1 dist/bin/
      - name: Write the Arch and Nix packaging files from SHA256SUMS
        run: mise run package:distros
        env:
          MISE_TASK_SKIP_DEPENDS: "1" # binaries and SHA256SUMS exist above; a rebuild would change the checksummed bytes
      - name: Upload the Arch and Nix packaging files for a manual publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distro-packaging
          path: dist/packaging
          include-hidden-files: true
          if-no-files-found: error
      # SPDX SBOM of the installed dependencies (node_modules exists after
      # compile:all). The webular.spdx.json name stays outside the webular-*
      # globs, so the checksum and per-file steps do not pick it up.
      - name: Generate the SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/bin/webular.spdx.json
          upload-artifact: false
          upload-release-assets: false
        env:
          SYFT_EXCLUDE: ./dist/**
      # Every release file, for the assets job. The artifact drops the
      # executable bit; attest and release upload hash bytes only, and smoke
      # runs chmod +x on its download.
      - name: Upload the release files for the assets job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/bin
          retention-days: 1
          if-no-files-found: error

  assets:
    needs: [test, test-musl, build-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 10 # download, two attestations, and the release upload
    permissions:
      contents: write # gh release create / upload (draft)
      id-token: write # Sigstore signing for the attestations
      attestations: write # store the attestations on the repo
      actions: read # gh run download of the release-files artifact
    steps:
      # The checkout gives gh release create its repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the release files build-assets wrote
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" -n release-files -D dist/bin
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/bin/webular-*
          sbom-path: dist/bin/webular.spdx.json
      - name: Attest build provenance for every release file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/bin/webular-*
            dist/bin/SHA256SUMS
            dist/bin/install.sh
            dist/bin/install.ps1
            dist/bin/webular.rb
            dist/bin/webular.json
            dist/bin/webular.1
      - name: Attach every file to a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=; case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          set -- dist/bin/webular-* dist/bin/SHA256SUMS dist/bin/install.sh dist/bin/install.ps1 dist/bin/webular.rb dist/bin/webular.json dist/bin/webular.1 dist/bin/webular.spdx.json
          gh release create "$GITHUB_REF_NAME" --draft $prerelease --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "$@" \
            || gh release upload "$GITHUB_REF_NAME" "$@" --clobber

  # Run each built executable on its native runner (musl ones in Alpine) before
  # anything is published. The draft release is readable with contents: write.
  smoke:
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, key: linux-x64 }
          - { os: ubuntu-24.04-arm, key: linux-arm64 }
          - { os: ubuntu-latest, key: linux-x64-musl, musl: true }
          - { os: ubuntu-24.04-arm, key: linux-arm64-musl, musl: true }
          - { os: macos-latest, key: darwin-arm64 }
          - { os: macos-15-intel, key: darwin-x64 }
          - { os: windows-latest, key: windows-x64, ext: .exe }
          - { os: windows-11-arm, key: windows-arm64, ext: .exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: write # gh release download of the draft release
    env:
      KEY: ${{ matrix.key }}
      EXT: ${{ matrix.ext }}
    steps:
      - name: Download webular-${{ matrix.key }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "webular-$KEY$EXT" --dir smoke
      - name: Run --version and --help
        if: ${{ !matrix.musl }}
        shell: bash
        run: |
          chmod +x smoke/*
          "./smoke/webular-$KEY$EXT" --version
          "./smoke/webular-$KEY$EXT" --help
      - name: Run --version and --help on Alpine
        if: ${{ matrix.musl }}
        run: |
          chmod +x smoke/*
          docker run --rm -e KEY -v "$PWD/smoke:/s:ro" alpine:3.22@sha256:d406446bc05b82480756ce8f1287964d28768c23955fa9480d2a74a2eae7a654 sh -ec 'apk add --no-cache libgcc libstdc++ && /s/webular-$KEY --version && /s/webular-$KEY --help'

  publish:
    needs: [assets, smoke]
    runs-on: ubuntu-latest
    environment: release
    # The build (typecheck chain) runs here, plus nine npm publishes and up to
    # 5 minutes of parallel registry waits: 20 minutes keeps about 2x headroom.
    timeout-minutes: 20
    outputs:
      dist-tag: ${{ steps.tag.outputs.dist-tag }}
    permissions:
      contents: write # read the draft release, then un-draft it
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # ships npm >= 11.5.1, required for OIDC publishing
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require npm 11.5.1 or later (trusted publishing)
        run: |
          v=$(npm --version)
          echo "npm $v"
          [ "$(printf '%s\n11.5.1\n' "$v" | sort -V | head -n1)" = 11.5.1 ] || { echo "::error::npm $v is older than 11.5.1, which trusted publishing needs"; exit 1; }
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      # Build before package:platforms rewrites package.json. Publish runs with
      # --ignore-scripts, so prepack (mise run build) never reruns bun install
      # --frozen-lockfile against optionalDependencies that bun.lock does not
      # list. Runs before the download, since the build clears dist/.
      - name: Build the root package contents
        run: mise run build
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      # Package the exact binaries the assets job attested, not a second compile.
      - name: Download the released executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'webular-*' --pattern SHA256SUMS --dir dist/bin
      - name: Check the downloads against the release SHA256SUMS
        run: (cd dist/bin && sha256sum --check --strict SHA256SUMS)
      - name: Write the per-platform npm packages
        run: mise run package:platforms
        env:
          MISE_TASK_SKIP_DEPENDS: "1" # binaries are downloaded above; skip compile:all
      - name: Pick the npm dist-tag
        id: tag
        run: |
          version=$(jq -r .version package.json)
          latest=$(npm view webular dist-tags.latest 2>/dev/null || true)
          echo "dist-tag=$(bun src/release/dist-tag.ts "$version" "$latest")" >> "$GITHUB_OUTPUT"
      - name: Publish the per-platform packages, then the root package
        env:
          DIST_TAG: ${{ steps.tag.outputs.dist-tag }}
        run: |
          publish() {
            name=$(jq -r .name "$1/package.json"); version=$(jq -r .version "$1/package.json")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "skip $name@$version: already on npm"
            else
              npm publish --ignore-scripts --provenance --access public --tag "$DIST_TAG" "$1"
            fi
          }
          for dir in npm/webular-*; do publish "$dir"; done
          # npm's malware scan can hold a tarball back; the root package
          # resolves its optionalDependencies, so wait for each, all at once
          # (30 x 10 s max in total, not per package).
          wait_for() {
            n=0
            until [ -n "$(npm view "$1" version 2>/dev/null)" ]; do
              n=$((n + 1)); [ "$n" -le 30 ] || { echo "$1 never appeared on npm" >&2; return 1; }
              sleep 10
            done
          }
          pids=
          for dir in npm/webular-*; do
            spec="$(jq -r '.name + "@" + .version' "$dir/package.json")"
            wait_for "$spec" & pids="$pids $!"
          done
          for pid in $pids; do wait "$pid"; done
          publish .
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ steps.tag.outputs.dist-tag }}
        run: |
          latest=; [ "$DIST_TAG" = latest ] || latest=--latest=false
          gh release edit "$GITHUB_REF_NAME" --draft=false $latest

  # Copies webular.rb from the release into srinitude/homebrew-webular.
  # TAP_TOKEN is a fine-grained token with Contents read and write on the tap
  # and bucket repos only.
  homebrew:
    needs: publish
    if: ${{ needs.publish.outputs.dist-tag == 'latest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Skip without TAP_TOKEN
        if: env.GH_TOKEN == ''
        run: echo "::notice::TAP_TOKEN is not set; skipping the srinitude/homebrew-webular update."
      - name: Push webular.rb to srinitude/homebrew-webular
        if: env.GH_TOKEN != ''
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          GH_TOKEN="$RELEASE_TOKEN" gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern webular.rb
          # Replacing a file needs its current blob sha; a new file has none.
          sha=$(gh api repos/srinitude/homebrew-webular/contents/Formula/webular.rb --jq .sha 2>/dev/null || true)
          gh api -X PUT repos/srinitude/homebrew-webular/contents/Formula/webular.rb \
            -f message="webular ${GITHUB_REF_NAME#v}" \
            -f content="$(base64 -w0 webular.rb)" \
            ${sha:+-f "sha=$sha"}

  # Copies webular.json from the release into srinitude/scoop-webular.
  scoop:
    needs: publish
    if: ${{ needs.publish.outputs.dist-tag == 'latest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Skip without TAP_TOKEN
        if: env.GH_TOKEN == ''
        run: echo "::notice::TAP_TOKEN is not set; skipping the srinitude/scoop-webular update."
      - name: Push webular.json to srinitude/scoop-webular
        if: env.GH_TOKEN != ''
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: |
          GH_TOKEN="$RELEASE_TOKEN" gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern webular.json
          # Replacing a file needs its current blob sha; a new file has none.
          sha=$(gh api repos/srinitude/scoop-webular/contents/bucket/webular.json --jq .sha 2>/dev/null || true)
          gh api -X PUT repos/srinitude/scoop-webular/contents/bucket/webular.json \
            -f message="webular ${GITHUB_REF_NAME#v}" \
            -f content="$(base64 -w0 webular.json)" \
            ${sha:+-f "sha=$sha"}
