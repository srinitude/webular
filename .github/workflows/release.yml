# webular release: runs on a v* tag push.
# test -> cross-compile every TARGETS entry (src/core/platform.ts) with
# `mise run compile:all` and attach each binary to the GitHub release as
# webular-<key>[.exe] -> publish one npm package per target (webular-<key>,
# with os/cpu/libc fields), then the root package that lists them as
# optionalDependencies. tests/core/platform-parity.test.ts keeps this file,
# mise.toml, and the resolver table in step.
# npm auth is trusted publishing (OIDC): no NPM_TOKEN. Before the first run, add
# this repo + workflow filename "release.yml" as a trusted publisher on npmjs.com
# for webular and for every webular-<key> package.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Keep equal to [tools] bun in mise.toml.
  BUN_VERSION: "1.4.3"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4 # about 3x a normal run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      - name: Tag must match package.json version
        run: test "v$(jq -r .version package.json)" = "${GITHUB_REF_NAME}"
      # mise.toml defines tasks.test (depends on setup -> lint -> typecheck -> build).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      - run: mise run test
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache

  assets:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10 # eight cross-compiles after the lint, typecheck, and build chain
    permissions:
      contents: write # gh release create / upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      - name: Cross-compile every target
        run: mise run compile:all
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      - name: Checksum the executables
        run: (cd dist/bin && sha256sum webular-* > SHA256SUMS)
      - name: Attach the binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag dist/bin/webular-* dist/bin/SHA256SUMS \
            || gh release upload "$GITHUB_REF_NAME" dist/bin/webular-* dist/bin/SHA256SUMS --clobber

  publish:
    needs: assets
    runs-on: ubuntu-latest
    timeout-minutes: 5 # nine npm publishes
    permissions:
      contents: read # gh release download
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # ships npm >= 11.5.1, required for OIDC publishing
          registry-url: https://registry.npmjs.org
      - run: npm --version
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          experimental: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bun-install-cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'bun.lock') }}
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
      # Package the exact binaries the assets job released, not a second compile.
      - name: Download the released executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'webular-*' --dir dist/bin
      - name: Write the per-platform npm packages
        run: mise run package:platforms
        env:
          MISE_TASK_SKIP_DEPENDS: "1" # binaries are downloaded above; skip compile:all
      - name: Publish the per-platform packages, then the root package
        run: |
          for dir in npm/webular-*; do npm publish --provenance --access public "$dir"; done
          npm publish --provenance --access public
