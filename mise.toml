# webular — universal task dependency graph (mise).
#
# Ordering note: the XState machines in src/machines/ model the CLI flows;
# their model-based tests (tests/machines/) walk every path against the real
# code. Tests are authored BEFORE code (R1).
#
# Graph shape (zero cycles — it is a tree rooted at `setup`):
#   setup -> lint -> typecheck -> build -> test -> validate -> ci
#   setup -> format                   (mutating dev task, OFF the check-only spine)
#   setup -> run:<command>            (one logical predecessor each)
# The CI/CD spine (setup..ci) is the SINGLE default dependency path and is
# check-only: `mise run ci` never mutates the working tree.
# The CLI never calls code directly: every subcommand/flag is routed as
#   `mise run run:<command> -- <args>`  (see bin/webular.ts).

min_version = "2026.5.18"

[tools]
bun = "1.4.3"

# ───────────────────────── Quality / CI spine ─────────────────────────
# Single linear default dependency path. Each task depends on exactly one
# logical predecessor, making the whole pipeline deterministic.

[tasks.setup]
description = "Install pinned dependencies (frozen lockfile) — root of the universal task graph"
run = "bun install --frozen-lockfile 1>&2"
sources = ["package.json", "bun.lock"]
# OS-neutral marker: the .bin entry is biome.exe on Windows.
outputs = ["node_modules/@biomejs/biome/package.json"]

[tasks.format]
description = "Format + organize imports + safe-fix sources with Biome (mutating; off the CI spine)"
depends = ["setup"]
run = "bunx biome check --write ."

[tasks.lint]
description = "Lint + format-verify with Biome (check-only CI gate)"
depends = ["setup"]
run = "bunx biome check ."

[tasks.typecheck]
description = "Compilation: strict TypeScript typecheck"
depends = ["lint"]
run = "bunx tsc --noEmit"

[tasks.build]
description = "Build: bundle the CLI entry to dist/"
depends = ["typecheck"]
run = 'bun build "{{config_root}}/bin/webular.ts" --target=bun --outdir="{{config_root}}/dist"'
sources = ["src/**/*.ts", "bin/**/*.ts", "tsconfig.json"]
outputs = ["dist/webular.js"]

[tasks.test]
description = "Run the bun test suite (CI/CD graph + contracts + integration)"
depends = ["build"]
run = "bun test --timeout 30000"

[tasks.validate]
description = "Validate gate — aggregates the full quality spine"
depends = ["test"]
run = "echo webular: validate OK"

[tasks.ci]
description = "CI entry — single default dependency path (local + remote)"
depends = ["validate"]
run = "echo webular: ci complete"

[tasks.clean]
description = "Remove build artifacts"
# Portable delete: `rm -rf` does not exist in the Windows task shell.
run = '''bun -e "require('node:fs').rmSync('dist', { recursive: true, force: true })"'''

# ───────────────────────── Capability commands ─────────────────────────
# Each is a Mastra workflow entrypoint. One logical predecessor (`setup`),
# branching off the root so command runs stay fast and deterministic
# without dragging the lint/typecheck spine into every invocation.

[tasks."run:search"]
description = "SEARCH — keyless web search (DuckDuckGo HTML + linkedom)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/search.ts"'

[tasks."run:scrape"]
description = "SCRAPE — single URL to clean content (Bun.fetch + readability + turndown)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/scrape.ts"'

[tasks."run:crawl"]
description = "CRAWL — recursive same-host traversal (Bun.fetch BFS + p-limit)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/crawl.ts"'

[tasks."run:map"]
description = "MAP — URL discovery only (sitemap + link BFS via linkedom)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/map.ts"'

[tasks."run:extract"]
description = "EXTRACT — structured/schema data (CSS selectors via linkedom + zod)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/extract.ts"'

[tasks."run:summarize"]
description = "SUMMARIZE — extractive summary (no model)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/summarize.ts"'

[tasks."run:answer"]
description = "ANSWER — grounded answer (search -> fetch -> synthesize)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/answer.ts"'

[tasks."run:research"]
description = "RESEARCH — search -> fetch -> extractive synthesis (3-step Mastra workflow)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/research.ts"'

[tasks."run:parse"]
description = "PARSE — documents to md/json (unpdf + mammoth + linkedom)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/parse.ts"'

[tasks."run:media"]
description = "MEDIA — screenshot/pdf/download (agent-browser + streamed download)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/media.ts"'

[tasks."run:monitor"]
description = "MONITOR — change tracking + scheduled monitors (diff + bun:sqlite)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/monitor.ts"'

[tasks."run:batch"]
description = "BATCH — concurrent over many targets (p-limit)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/batch.ts"'

[tasks."run:doctor"]
description = "DOCTOR — environment + toolchain diagnostics (clig.dev)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/doctor.ts"'

[tasks."run:tasks"]
description = "TASKS — introspect the mise task graph this CLI routes through"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/tasks.ts"'

[tasks."run:mcp"]
description = "MCP — expose webular capabilities as an MCP server"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/mcp.ts"'

[tasks."run:diagram"]
description = "DIAGRAM — list the XState machines in src/machines"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/diagram.ts"'

[tasks."run:audit"]
description = "AUDIT — deepsec vulnerability scan of composed tools"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/audit.ts"'

[tasks."run:act"]
description = "ACT — drive a real browser (open/snapshot/screenshot/interact) via agent-browser"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/act.ts"'

[tasks."run:feed"]
description = "FEED — read an RSS 2.0 or Atom 1.0 feed (fetch + linkedom XML)"
depends = ["setup"]
run = 'bun "{{config_root}}/src/commands/feed.ts"'

# ───────────────────────── Default + benchmark ─────────────────────────

[tasks.default]
description = "Default path: a bare `mise run` runs the whole CI spine"
depends = ["ci"]
run = "echo webular: default complete"

[tasks.bench]
description = "Benchmark cold start (wall + CPU) of the CLI and its network-free commands with hyperfine, then the summarizer scaling run at 10, 1,000 and 100,000 sentences (off the CI spine)"
depends = ["setup"]
run = """
command -v hyperfine >/dev/null || { echo 'bench: hyperfine not on PATH (brew install hyperfine)' >&2; exit 127; }
hyperfine -N --warmup 1 --runs ${BENCH_RUNS:-10} --style basic \
  -n help 'bun bin/webular.ts --help' \
  -n version 'bun bin/webular.ts --version' \
  -n tasks 'bun bin/webular.ts tasks --json' \
  -n doctor 'bun bin/webular.ts doctor --json' \
  -n diagram 'bun bin/webular.ts diagram --json' \
  -n summarize 'bun bin/webular.ts summarize --text "One. Two words here. Three." --json' \
  -n direct-diagram 'bun src/commands/diagram.ts --json' \
  -n direct-summarize 'bun src/commands/summarize.ts --text "One. Two." --json' \
  -n import-feed-workflow "bun -e 'await import(\\"./src/workflows/feed.ts\\")'" \
  -n import-mastra-workflows "bun -e 'await import(\\"@mastra/core/workflows\\")'" \
  -n bare-bun "bun -e 0"
bun tests/bench/complexity.ts
"""
