# webular — universal task dependency graph (mise).
#
# Ordering note: the XState machines in src/machines/ model the CLI flows;
# their model-based tests (tests/machines/) walk every path against the real
# code. Tests are authored BEFORE code (R1).
#
# Graph shape (zero cycles — it is a tree rooted at `setup`):
#   setup -> lint -> docs:links -> docs:tasks:check -> prune:check -> bugs:static
#     -> typecheck -> build -> test -> bugs:check -> validate -> ci
#   setup -> bugs:<class>             (one read-only bug hunt each)
#   setup -> format                   (mutating dev task, OFF the check-only spine)
#   setup -> run:<command>            (one logical predecessor each)
# The CI/CD spine (setup..ci) is the SINGLE default dependency path and is
# check-only: `mise run ci` never mutates the working tree.
# The CLI never imports command code: each subcommand starts its run:<command>
#   entry in its own process via src/cli/dispatch-table.ts, generated from here.

min_version = "2026.5.18"

[settings]
lockfile = true

[tools]
bun = "1.4.3"

[vars]
# run:* runtime: a compiled webular passes its own path (with BUN_BE_BUN=1),
# so no second bun is needed; otherwise bun from PATH.
bun = "{{ get_env(name='WEBULAR_BUN', default='bun') }}"
# WEBULAR_DEV=1 runs commands straight from src/ (no build step); the default
# runs the minified dist/ bundles, which start with about half the CPU.
commands = "{% if get_env(name='WEBULAR_DEV', default='') != '' %}src{% else %}dist{% endif %}/commands"
ext = "{% if get_env(name='WEBULAR_DEV', default='') != '' %}ts{% else %}js{% endif %}"
# Listed, not globbed: the Windows task shell does not expand globs.
entries = '"{{config_root}}/src/commands/act.ts" "{{config_root}}/src/commands/answer.ts" "{{config_root}}/src/commands/audit.ts" "{{config_root}}/src/commands/batch.ts" "{{config_root}}/src/commands/crawl.ts" "{{config_root}}/src/commands/diagram.ts" "{{config_root}}/src/commands/doctor.ts" "{{config_root}}/src/commands/extract.ts" "{{config_root}}/src/commands/feed.ts" "{{config_root}}/src/commands/jev.ts" "{{config_root}}/src/commands/map.ts" "{{config_root}}/src/commands/mcp.ts" "{{config_root}}/src/commands/media.ts" "{{config_root}}/src/commands/monitor.ts" "{{config_root}}/src/commands/parse.ts" "{{config_root}}/src/commands/research.ts" "{{config_root}}/src/commands/scrape.ts" "{{config_root}}/src/commands/search.ts" "{{config_root}}/src/commands/summarize.ts" "{{config_root}}/src/commands/tasks.ts" "{{config_root}}/src/commands/upgrade.ts" "{{config_root}}/src/commands/completions.ts" "{{config_root}}/src/lib/parse-worker.ts"'

# ───────────────────────── Quality / CI spine ─────────────────────────
# Single linear default dependency path. Each task depends on exactly one
# logical predecessor, making the whole pipeline deterministic.

[tasks.setup]
description = "Install pinned dependencies (frozen lockfile) — root of the universal task graph"
run = "bun install --frozen-lockfile 1>&2"
sources = ["package.json", "bun.lock"]
# OS-neutral marker: the .bin entry is biome.exe on Windows.
outputs = ["node_modules/@biomejs/biome/package.json"]

[tasks.format]
description = "Format + organize imports + safe-fix sources with Biome (mutating; off the CI spine)"
depends = ["setup"]
run = "bunx biome check --write ."

[tasks.lint]
description = "Lint + format-verify with Biome (check-only CI gate)"
depends = ["setup"]
run = "bunx biome check ."

[tasks."docs:links"]
description = "Docs: every tracked Markdown file links each repo path it names, and every relative link, heading anchor, and line anchor resolves (--fix links bare paths)"
depends = ["lint"]
run = 'bun "{{config_root}}/plugins/webular/scripts/check-links.ts" --repo'

[tasks."docs:tasks:check"]
description = "Docs: docs/tasks.md matches `mise tasks --json` (check-only; `mise run docs:tasks` rewrites it)"
depends = ["docs:links"]
run = 'bun "{{config_root}}/scripts/tasks-doc.ts" --check'

[tasks."docs:tasks"]
description = "Docs: rewrite docs/tasks.md from `mise tasks --json` (writes files; off the CI spine)"
depends = ["setup"]
run = 'bun "{{config_root}}/scripts/tasks-doc.ts"'

[tasks."prune:check"]
description = "Prune: knip finds unused files, exports, types, and dependencies from the entry points in knip.json (check-only; fails on any finding)"
depends = ["docs:tasks:check"]
run = "bunx knip --no-progress"

[tasks."prune:fix"]
description = "Prune: apply knip's safe fixes (unused exports, types, dependencies; never files), keep them only if typecheck and the quality tests pass, else undo them. Needs a clean tree; --dry lists what it would remove (off the CI spine)"
depends = ["setup"]
usage = 'flag "--dry" help="List what would be removed; change nothing"'
run = """
set -e
if [ "${usage_dry:-false}" = "true" ]; then
  bunx knip --no-progress --no-exit-code --include exports,types,dependencies,devDependencies --reporter compact
  exit 0
fi
[ -z "$(git status --porcelain)" ] || { echo 'prune:fix: commit or set aside your changes first' >&2; exit 1; }
bunx knip --no-progress --no-exit-code --fix --fix-type exports,types,dependencies
bun install 1>&2
bunx biome check --write . >/dev/null || true
if bun node_modules/typescript/bin/tsc --noEmit && bun node_modules/typescript/bin/tsc --noEmit -p plugins/webular && bun test --timeout 60000 ./tests/quality; then
  git status --short
else
  echo 'prune:fix: checks failed after the fixes; undoing them' >&2
  git diff --binary | git apply -R
  exit 1
fi
"""

[tasks."sync:check"]
description = "Drift: every generated or mirrored file matches its source (dispatch table, bench docs, practices and rule files, skills and plugin tools, docs/tasks.md). A focused subset of `mise run test`"
depends = ["build", "plugin:bundle"]
run = [
  'bun "{{config_root}}/scripts/tasks-doc.ts" --check',
  "bun test --timeout 60000 tests/cli/dispatch.test.ts tests/bench/bench-docs.test.ts tests/quality/practices-config.test.ts tests/quality/rule-files.test.ts tests/contract/skills.test.ts tests/contract/plugin-tools.test.ts",
]

[tasks."docs:chain:check"]
description = "Docs: the readability-chain ledger rows, AGENTS.md rules, Markdown links, and the plugin's timeless wording all hold. A focused subset of `mise run test`"
depends = ["setup"]
run = [
  "bun test --timeout 60000 tests/quality/agents-md.test.ts tests/quality/markdown-links.test.ts tests/quality/markdown-chain-ledger.test.ts",
  'bun "{{config_root}}/plugins/webular/scripts/check-timeless.ts"',
]

[tasks."docs:facts"]
description = "Docs: the facts in README.md and docs/install.md, and the repo and plugin descriptions, match the code. A focused subset of `mise run test`"
depends = ["setup"]
run = "bun test --timeout 60000 tests/quality/readme-facts.test.ts tests/release/description-sync.test.ts"

[tasks."os:check"]
description = "Every OS, locally: shell completions parse, the e2e parity list, the CLI gateway, and the Jev key lookup on each platform. Linux, macOS, and Windows each run the full suite only in CI (.github/workflows/ci.yml)"
depends = ["setup"]
run = "bun test --timeout 60000 tests/release/completions.test.ts tests/quality/e2e-parity.test.ts tests/cli/gateway.test.ts tests/jev/key-platform.test.ts"

[tasks."bugs:static"]
description = "Bugs: static guards from docs/bug-classes.md (no MCP stdout writes, no `as any`, no JSON.parse casts, no shell strings, no raw fetch); read-only"
depends = ["prune:check"]
run = 'bun "{{config_root}}/scripts/bugs-check.ts"'

[tasks.typecheck]
description = "Compilation: strict TypeScript typecheck of the CLI and of plugins/webular (its own tsconfig, outside the root include)"
depends = ["bugs:static"]
run = ["bun node_modules/typescript/bin/tsc --noEmit", "bun node_modules/typescript/bin/tsc --noEmit -p plugins/webular"]

[tasks.build]
description = "Build: bundle every command into dist/commands (shared chunks in dist/chunks), and compile the native webular executable into dist/bin"
depends = ["typecheck"]
run = [
  'bun scripts/gen-dispatch.ts',
  'bun scripts/clean.ts',
  'bun build {{vars.entries}} --target=bun --minify --splitting --root="{{config_root}}/src" --outdir="{{config_root}}/dist" --chunk-naming=chunks/[name]-[hash].[ext]',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --outfile="{{config_root}}/dist/bin/webular"',
  'bun build "{{config_root}}/src/release/node-launcher.ts" --target=node --format=esm --minify --outfile="{{config_root}}/dist/webular.js"',
]
sources = ["src/**/*.ts", "bin/**/*.ts", "scripts/**/*.ts", "mise.toml", "package.json", "tsconfig.json"]
outputs = ["dist/commands/search.js", "dist/bin/webular", "dist/webular.js"]

[tasks.clean]
description = "Delete build output (dist/) on every OS; never touches bench results, recordings, or caches"
run = 'bun "{{config_root}}/scripts/clean.ts"'

[tasks."release:dry"]
description = "Release dry run: build, then list what `bun pm pack` would publish without writing a tarball (off the CI spine)"
depends = ["build"]
run = "bun pm pack --dry-run"

[tasks."compile:all"]
description = "Cross-compile the webular executable for every Bun target into dist/bin (release path, off the check-only spine)"
depends = ["build"]
run = [
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-darwin-arm64 --outfile="{{config_root}}/dist/bin/webular-darwin-arm64"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-darwin-x64 --outfile="{{config_root}}/dist/bin/webular-darwin-x64"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-linux-x64 --outfile="{{config_root}}/dist/bin/webular-linux-x64"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-linux-arm64 --outfile="{{config_root}}/dist/bin/webular-linux-arm64"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-linux-x64-musl --outfile="{{config_root}}/dist/bin/webular-linux-x64-musl"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-linux-arm64-musl --outfile="{{config_root}}/dist/bin/webular-linux-arm64-musl"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-windows-x64 --outfile="{{config_root}}/dist/bin/webular-windows-x64.exe"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-windows-arm64 --outfile="{{config_root}}/dist/bin/webular-windows-arm64.exe"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-darwin-x64-baseline --outfile="{{config_root}}/dist/bin/webular-darwin-x64-baseline"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-linux-x64-baseline --outfile="{{config_root}}/dist/bin/webular-linux-x64-baseline"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-linux-x64-musl-baseline --outfile="{{config_root}}/dist/bin/webular-linux-x64-musl-baseline"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-windows-x64-baseline --outfile="{{config_root}}/dist/bin/webular-windows-x64-baseline.exe"',
]

[tasks."package:platforms"]
description = "Write one npm package per executable target into npm/ and list them as optionalDependencies (release path, after compile:all)"
depends = ["compile:all"]
run = 'bun "{{config_root}}/src/release/platform-packages.ts"'

[tasks."package:github"]
description = "Rename the root and npm/ packages to @srinitude/<name> for the GitHub Packages registry (release path, after package:platforms)"
depends = ["package:platforms"]
run = 'bun "{{config_root}}/src/release/github-packages.ts"'

[tasks."package:manifests"]
description = "Write the Homebrew formula and Scoop manifest into dist/bin from dist/bin/SHA256SUMS (release path, after compile:all)"
depends = ["compile:all"]
run = 'bun "{{config_root}}/src/release/distribution.ts"'

[tasks."package:winget"]
description = "Write the winget manifest set (version, installer, defaultLocale) into dist/bin/winget from dist/bin/SHA256SUMS (release path, after compile:all)"
depends = ["compile:all"]
run = 'bun "{{config_root}}/src/release/winget.ts"'

[tasks."package:completions"]
description = "Write shell completions (bash, zsh, fish, PowerShell) into dist/completions from the command and flag tables (release path, after compile:all)"
depends = ["compile:all"]
run = 'bun "{{config_root}}/src/release/completions.ts"'

[tasks."package:man"]
description = "Write the webular(1) manual page to dist/man/webular.1 (release path)"
run = 'bun "{{config_root}}/src/release/manpage.ts"'

[tasks."package:distros"]
description = "Write the AUR PKGBUILD, .SRCINFO, and webular.nix into dist/packaging from dist/bin/SHA256SUMS (release path, after compile:all)"
depends = ["compile:all"]
run = 'bun "{{config_root}}/src/release/distros.ts"'

[tasks."nix:refresh"]
description = "Rewrite the repo-root webular.nix from a published release's SHA256SUMS (default: the release at `releases/latest`); run after each publish, then commit it to the open PR branch. Off the linear spine"
depends = ["setup"]
usage = 'arg "[version]" help="Published version, like 0.3.2 or v0.3.2"'
run = 'bun "{{config_root}}/src/release/nix-refresh.ts" refresh{% if usage.version %} "{{ usage.version }}"{% endif %}'

[tasks."nix:check"]
description = "Read-only: fails when webular.nix pins a version other than the tag of the release at `releases/latest`. Off the linear spine"
depends = ["setup"]
run = 'bun "{{config_root}}/src/release/nix-refresh.ts" check'

[tasks."test:file"]
description = "Run the named test files only (targeted check while editing)"
depends = ["setup"]
usage = 'arg "<files>" var=#true help="Test files or folders to run"'
# Tera, not $usage_files: the Windows task shell does not expand $VARS.
run = 'bun test --timeout 30000{% for file in usage.files %} "{{ file }}"{% endfor %}'

[tasks.test]
description = "Run the bun test suite (CI/CD graph + contracts + integration)"
depends = ["build"]
# One worker per core: most test time is waiting (timeouts, retries, child
# processes), so files run side by side. Each file still gets a fresh global.
# WEBULAR_TEST_SHARD=k/n runs shard k of n (bun test --shard), for CI
# runners that split the suite; unset, every file runs.
run = "bun test --timeout 30000 --parallel{% if get_env(name='WEBULAR_TEST_SHARD', default='') != '' %} --shard={{ get_env(name='WEBULAR_TEST_SHARD', default='') }}{% endif %}"

[tasks."test:shuffled"]
description = "Run the bun test suite in random order; a failure prints its seed so the order-dependent test reproduces (off the CI spine)"
depends = ["build"]
run = "bun test --timeout 30000 --parallel --randomize"

[tasks."jev:check"]
description = "Jev framework checks (off the linear spine; the test task runs them too): payload caps and flat cost, canonical bytes, the 0.95 bar, machine-only moves, record and replay, the raw-call lint, the doctor Jev route row, and the evals"
depends = ["setup"]
# A drifted answering model (lines in this file) makes the evals a required live rerun.
env = { WEBULAR_JEV_DRIFT_FILE = "{{ get_env(name='WEBULAR_JEV_DRIFT_FILE', default=config_root ~ '/.cache/jev-drift.jsonl') }}" }
run = "bun test ./tests/jev --timeout 30000"

[tasks."repo:settings"]
description = "Apply .github/repo-settings.json (description, homepage, topics) to the GitHub repository; writes to GitHub, so run it on purpose. Off the linear spine"
depends = ["setup"]
run = "bun scripts/repo-settings.ts apply"

[tasks."repo:settings:check"]
description = "Read-only: fails naming each GitHub repository setting that drifted from .github/repo-settings.json. No other task depends on it"
depends = ["setup"]
run = "bun scripts/repo-settings.ts check"

[tasks."jev:docs"]
description = "Refresh and verify the Jev docs snapshot: conditional GET of docs.typesafe.ai/llms-full.txt (a 304 when unchanged), proof (sha256, line count, chunk boundaries) written to src/lib/jev/docs-snapshot.json; pass --replay to re-prove the committed recording offline"
depends = ["setup"]
run = "bun scripts/jev-docs.ts"

[tasks."jev:latest-check"]
description = "Fails when docs.typesafe.ai lists a Jev release above JEV_LATEST_RELEASED in src/lib/jev/model.ts. No other task depends on it"
depends = ["setup"]
run = "bun scripts/jev-latest-check.ts"

[tasks."bugs:security"]
description = "Bug hunt: run the security class guards (SSRF, robots order, injection, CI credentials) from docs/bug-classes.md; prints every missing guard; read-only"
depends = ["setup"]
run = 'bun "{{config_root}}/scripts/bugs-hunt.ts" security'

[tasks."bugs:effect"]
description = "Bug hunt: run the effect class guards (defects, interruption, scopes, child processes) from docs/bug-classes.md; prints every missing guard; read-only"
depends = ["setup"]
run = 'bun "{{config_root}}/scripts/bugs-hunt.ts" effect'

[tasks."bugs:mcp-cli"]
description = "Bug hunt: run the mcp-cli class guards (MCP stdout and tools, exit codes, CLI contract) from docs/bug-classes.md; prints every missing guard; read-only"
depends = ["setup"]
run = 'bun "{{config_root}}/scripts/bugs-hunt.ts" mcp-cli'

[tasks."bugs:parsing"]
description = "Bug hunt: run the parsing class guards (URLs, charset, gzip and body caps, canonical keys) from docs/bug-classes.md; prints every missing guard; read-only"
depends = ["setup"]
run = 'bun "{{config_root}}/scripts/bugs-hunt.ts" parsing'

[tasks."bugs:tests-build"]
description = "Bug hunt: run the tests-build class guards (quality gates, CI graph, release) from docs/bug-classes.md; prints every missing guard; read-only"
depends = ["setup"]
run = 'bun "{{config_root}}/scripts/bugs-hunt.ts" tests-build'

[tasks."bugs:jev"]
description = "Bug hunt: run the jev class guards (Jev definitions, replays, XState machines) from docs/bug-classes.md; prints every missing guard; read-only"
depends = ["setup"]
run = 'bun "{{config_root}}/scripts/bugs-hunt.ts" jev'

[tasks."bugs:os"]
description = "Bug hunt: run the os class guards (platform parity and paths) from docs/bug-classes.md; prints every missing guard; read-only"
depends = ["setup"]
run = 'bun "{{config_root}}/scripts/bugs-hunt.ts" os'

[tasks."bugs:cross-branch"]
description = "Bug hunt: run the cross-branch class guards (pinned literals to rerun after a combined land) from docs/bug-classes.md; prints every missing guard; read-only"
depends = ["setup"]
run = 'bun "{{config_root}}/scripts/bugs-hunt.ts" cross-branch'

[tasks."bugs:check"]
description = "Bugs: the static guards, then every bug-hunt class (bugs:security through bugs:cross-branch) in one read-only CI node"
depends = ["test"]
run = ['bun "{{config_root}}/scripts/bugs-check.ts"', 'bun "{{config_root}}/scripts/bugs-hunt.ts" all']

[tasks.validate]
description = "Validate gate — aggregates the full quality spine"
depends = ["bugs:check"]
run = "echo webular: validate OK"

[tasks.ci]
description = "CI entry — single default dependency path (local + remote)"
depends = ["validate"]
run = "echo webular: ci complete"

# ───────────────────────── Capability commands ─────────────────────────
# Each is a Mastra workflow entrypoint. One logical predecessor (`setup`),
# branching off the root so command runs stay fast and deterministic
# without dragging the lint/typecheck spine into every invocation.

[tasks."run:search"]
description = "SEARCH — keyless web search (DuckDuckGo HTML + linkedom)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/search.{{vars.ext}}"'

[tasks."run:scrape"]
description = "SCRAPE — single URL to clean content (Bun.fetch + readability + turndown)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/scrape.{{vars.ext}}"'

[tasks."run:crawl"]
description = "CRAWL — recursive same-host traversal (Bun.fetch BFS)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/crawl.{{vars.ext}}"'

[tasks."run:map"]
description = "MAP — URL discovery only (sitemap + link BFS via linkedom)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/map.{{vars.ext}}"'

[tasks."run:extract"]
description = "EXTRACT — structured/schema data (CSS selectors via linkedom + zod)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/extract.{{vars.ext}}"'

[tasks."run:summarize"]
description = "SUMMARIZE — extractive summary (no model)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/summarize.{{vars.ext}}"'

[tasks."run:answer"]
description = "ANSWER — grounded answer (search -> fetch -> synthesize)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/answer.{{vars.ext}}"'

[tasks."run:research"]
description = "RESEARCH — search -> fetch -> extractive synthesis (3-step Mastra workflow)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/research.{{vars.ext}}"'

[tasks."run:parse"]
description = "PARSE — documents to md/json (unpdf + mammoth + linkedom)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/parse.{{vars.ext}}"'

[tasks."run:media"]
description = "MEDIA — screenshot/pdf/download (agent-browser + streamed download)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/media.{{vars.ext}}"'

[tasks."run:monitor"]
description = "MONITOR — change tracking + scheduled monitors (diff + bun:sqlite)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/monitor.{{vars.ext}}"'

[tasks."run:batch"]
description = "BATCH — concurrent over many targets"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/batch.{{vars.ext}}"'

[tasks."run:doctor"]
description = "DOCTOR — environment + toolchain diagnostics (clig.dev)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/doctor.{{vars.ext}}"'

[tasks."run:tasks"]
description = "TASKS — introspect the mise task graph this CLI routes through"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/tasks.{{vars.ext}}"'

[tasks."run:mcp"]
description = "MCP — expose webular capabilities as an MCP server"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/mcp.{{vars.ext}}"'

[tasks."run:diagram"]
description = "DIAGRAM — list the XState machines in src/machines"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/diagram.{{vars.ext}}"'

[tasks."run:audit"]
description = "AUDIT — deepsec vulnerability scan of composed tools"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/audit.{{vars.ext}}"'

[tasks."run:act"]
description = "ACT — drive a real browser (open/snapshot/screenshot/interact) via agent-browser"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/act.{{vars.ext}}"'

[tasks."run:feed"]
description = "FEED — read an RSS 2.0 or Atom 1.0 feed (fetch + linkedom XML)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/feed.{{vars.ext}}"'

[tasks."run:jev"]
description = "JEV — learn from recorded Jev calls, or label one call as an eval case"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/jev.{{vars.ext}}"'

[tasks."run:upgrade"]
description = "UPGRADE — print (or with --yes, run) the command that upgrades this install"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/upgrade.{{vars.ext}}"'

[tasks."run:completions"]
description = "COMPLETIONS — print the shell completion script for bash, zsh, fish, or powershell"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/completions.{{vars.ext}}"'

# ───────────────────────── Agent plugin (plugins/webular) ─────────────────────────

[tasks."plugin:lint"]
description = "Plugin: lint and format-check the webular agent plugin"
depends = ["setup"]
run = "bunx biome check plugins/webular"

[tasks."plugin:typecheck"]
description = "Plugin: strict TypeScript typecheck of plugins/webular"
depends = ["plugin:lint"]
run = "bun node_modules/typescript/bin/tsc --noEmit -p plugins/webular"

[tasks."plugin:check-test-first"]
description = "Plugin: each src file has a test that names or imports it"
depends = ["plugin:typecheck"]
run = 'bun "{{config_root}}/plugins/webular/scripts/check-test-first.ts"'

[tasks."plugin:check-evals"]
description = "Plugin: each skill has at least 3 eval cases and the harness config parses"
depends = ["plugin:check-test-first"]
run = 'bun "{{config_root}}/plugins/webular/scripts/check-evals.ts"'

[tasks."plugin:code-limits"]
description = "Plugin: files at most 200 lines, functions at most 30 lines, nesting at most 3"
depends = ["plugin:check-evals"]
run = 'bun "{{config_root}}/plugins/webular/scripts/code-limits.ts"'

[tasks."plugin:check-links"]
description = "Plugin: every relative Markdown link and anchor resolves"
depends = ["plugin:code-limits"]
run = 'bun "{{config_root}}/plugins/webular/scripts/check-links.ts"'

[tasks."plugin:check-reachable"]
description = "Plugin: every skill file is linked from its SKILL.md"
depends = ["plugin:check-links"]
run = 'bun "{{config_root}}/plugins/webular/scripts/check-reachable.ts"'

[tasks."plugin:check-timeless"]
description = "Plugin: no time-anchored wording in Markdown"
depends = ["plugin:check-reachable"]
run = 'bun "{{config_root}}/plugins/webular/scripts/check-timeless.ts"'

[tasks."plugin:bundle"]
description = "Plugin: bundle the MCP server into plugins/webular/dist/server.js, the file mcp.json starts, so a host starts it without transpiling hundreds of modules"
depends = ["setup"]
run = 'bun build --target=bun --minify "{{config_root}}/plugins/webular/src/server.ts" --outfile="{{config_root}}/plugins/webular/dist/server.js"'

[tasks."plugin:test"]
description = "Plugin: run the webular agent plugin's outcome evals and tests"
depends = ["plugin:check-timeless", "plugin:bundle"]
run = "bun test --timeout 30000 plugins/webular"

[tasks."plugin:ci"]
description = "Plugin chain: lint, typecheck, six checks, evals, and tests of plugins/webular"
depends = ["plugin:test"]
run = "echo 'webular plugin: ci complete'"

[tasks."plugin:dev"]
description = "Plugin: serve MCP over HTTPS at a stable portless URL (webular-mcp.localhost)"
depends = ["setup"]
run = 'bunx portless webular-mcp bun "{{config_root}}/plugins/webular/src/server.ts" --http'

# ───────────────────────── webular.dev site (off the CI spine) ─────────────────────────

[tasks."site:build"]
description = "Site: build webular.dev into site/dist: tools.json from the live `webular mcp` tools/list, the Astro pages, then every .md twin and machine file"
depends = ["setup"]
dir = "{{config_root}}/site"
run = [
  "bun install --frozen-lockfile 1>&2",
  'bun "{{config_root}}/site/scripts/tokens-css.ts" 1>&2',
  'bunx biome format --write "{{config_root}}/site/src/grid.css" "{{config_root}}/site/src/semantic.css" 1>&2',
  'bun "{{config_root}}/site/scripts/tools-json.ts"',
  'PUBLIC_BUILD_SHA="$(git rev-parse --short HEAD)" PUBLIC_BUILD_DATE="$(git log -1 --format=%cs)" bun --bun "{{config_root}}/site/node_modules/astro/bin/astro.mjs" build',
  'bun "{{config_root}}/site/scripts/machine-files.ts"',
]

[tasks."docs:build"]
description = "Docs: build webular.dev, then the Fumadocs docs (pages from docs/*.md, a static Next export with its search index) into site-docs/out, publish them into site/dist/docs beside the site, with the designed docs page as the /docs index, then check every internal link in site/dist"
depends = ["setup", "site:build"]
dir = "{{config_root}}/site-docs"
run = [
  "bun install --frozen-lockfile 1>&2",
  'bun "{{config_root}}/scripts/docs-content.ts"',
  'bun --bun "{{config_root}}/site-docs/node_modules/next/dist/bin/next" build 1>&2',
  'bun "{{config_root}}/scripts/docs-content.ts" --publish',
  'bun "{{config_root}}/scripts/docs-links.ts"',
]

[tasks."docs:outputs"]
description = "Docs: record the real text and --json output of each URL command against the contract fixture site, for the command pages"
depends = ["setup"]
run = 'bun "{{config_root}}/scripts/docs-outputs.ts"'

[tasks."docs:dev"]
description = "Docs: serve the Fumadocs site at localhost:3000/docs with live reload (pages from docs/*.md)"
depends = ["setup"]
dir = "{{config_root}}/site-docs"
run = [
  "bun install --frozen-lockfile 1>&2",
  'bun "{{config_root}}/scripts/docs-content.ts"',
  'bun --bun "{{config_root}}/site-docs/node_modules/next/dist/bin/next" dev',
]

[tasks."site:test"]
description = "Site: on site/dist, no sideways scroll at 320 to 2560 px with the hero command on screen, zero serious or critical axe issues, and a home page under 100 KB gzip with no third-party script"
depends = ["site:build"]
dir = "{{config_root}}/site"
run = [
  'bun "{{config_root}}/site/node_modules/playwright/cli.js" install chromium-headless-shell 1>&2',
  'bun "{{config_root}}/site/scripts/check-site.ts"',
  'bun "{{config_root}}/site/scripts/home-shots.ts"',
  'cd "{{config_root}}" && bun test --timeout 60000 tests/quality/site-routes.test.ts tests/quality/site-copy-failed.test.ts',
]

[tasks."site:dev"]
description = "Site: serve webular.dev from site/src with live reload (writes tools.json first)"
depends = ["setup"]
dir = "{{config_root}}/site"
run = [
  "bun install --frozen-lockfile 1>&2",
  'bun "{{config_root}}/site/scripts/tools-json.ts"',
  'bun --bun "{{config_root}}/site/node_modules/astro/bin/astro.mjs" dev',
]

[tasks."site:deploy"]
description = "Site: deploy site/dist to Cloudflare Workers static assets for webular.dev and www.webular.dev (needs a signed-in wrangler; never in CI)"
depends = ["docs:build"]
dir = "{{config_root}}/site"
run = 'bun "{{config_root}}/site/node_modules/wrangler/bin/wrangler.js" deploy'

# ───────────────────────── Default + benchmark ─────────────────────────

[tasks.e2e]
description = "End-to-end: every command, flag, MCP tool, plugin tool, skill, and the executable, from the user's side, on a local fixture server"
depends = ["build"]
run = "bun tests/e2e/run.ts"

[tasks.default]
description = "Default path: a bare `mise run` runs the repo CI spine, the plugin chain, then the end-to-end run"
depends = ["ci", "plugin:ci", "e2e"]
run = "echo webular: default complete"

# ───────────────────────── Three-model test (subscription; never CI) ─────────────────────────

[tasks."test:models"]
description = "Run the agent scenarios through headless Claude Code on the subscription models, per surface, into bench/results (off the CI spine; pass --smoke for one run per model)"
depends = ["build"]
run = 'bun "{{config_root}}/tests/models/run.ts"'

[tasks."bench:matrix"]
description = "Agent benchmark matrix: `test:models --agent` runs the Jev-off, Jev-on, and rival arms on the three subscription models into bench/results (paid and live; off the CI spine)"
depends = ["build"]
run = 'bun "{{config_root}}/tests/models/run.ts" --agent'

[tasks.bench]
description = "Benchmark cold start (wall + CPU) of the CLI and its network-free commands with hyperfine, then the summarizer scaling run at 10, 1,000 and 100,000 sentences (off the CI spine)"
depends = ["setup"]
run = """
command -v hyperfine >/dev/null || { echo 'bench: hyperfine not on PATH (brew install hyperfine)' >&2; exit 127; }
hyperfine -N --warmup 1 --runs ${BENCH_RUNS:-10} --style basic \
  -n help 'bun bin/webular.ts --help' \
  -n version 'bun bin/webular.ts --version' \
  -n tasks 'bun bin/webular.ts tasks --json' \
  -n doctor 'bun bin/webular.ts doctor --json' \
  -n diagram 'bun bin/webular.ts diagram --json' \
  -n summarize 'bun bin/webular.ts summarize --text "One. Two words here. Three." --json' \
  -n direct-diagram 'bun src/commands/diagram.ts --json' \
  -n direct-summarize 'bun src/commands/summarize.ts --text "One. Two." --json' \
  -n bundle-diagram 'bun dist/commands/diagram.js --json' \
  -n bundle-summarize 'bun dist/commands/summarize.js --text "One. Two." --json' \
  -n exe-help 'dist/bin/webular --help' \
  -n exe-version 'dist/bin/webular --version' \
  -n exe-diagram 'env BUN_BE_BUN=1 dist/bin/webular dist/commands/diagram.js --json' \
  -n exe-summarize 'env BUN_BE_BUN=1 dist/bin/webular dist/commands/summarize.js --text "One. Two." --json' \
  -n import-feed-workflow 'bun scripts/bench/import-feed-workflow.ts' \
  -n import-mastra-workflows 'bun scripts/bench/import-mastra-workflows.ts' \
  -n bare-bun 'bun scripts/bench/bare-bun.ts'
bun tests/bench/complexity.ts
"""

[tasks."bench:peers"]
description = "Peer benchmark from recordings: webular vs Firecrawl, Exa, Tavily, Perplexity, Parallel; free and deterministic (off the CI spine)"
depends = ["setup"]
run = "bun scripts/bench/peers/run.ts"

[tasks."bench:peers:live"]
description = "Peer benchmark live: calls each keyed provider (at most 20 calls per peer), records responses, writes bench/results (off the CI spine)"
depends = ["setup"]
# A new results file always refreshes the docs that quote it.
run = ["bun scripts/bench/peers/run.ts --live", "bun scripts/bench/peers/docs.ts"]

[tasks."bench:scoreboard"]
description = "Rewrite bench/scoreboard.json and the scoreboard table in docs/scoreboard.md: every metric for every command, its value, eval, and set"
depends = ["setup"]
run = "bun scripts/bench/scoreboard.ts"

[tasks."bench:docs"]
description = "Rewrite the generated benchmark blocks in README.md, docs/benchmarks.md, and docs/benchmarks-peers.md from the committed peer run with the highest timestamp in bench/results"
depends = ["setup"]
run = "bun scripts/bench/peers/docs.ts"

[tasks."bench:data"]
description = "Download the pinned public bench datasets (WebMainBench subset, Firecrawl scrape set) into .cache/bench-data and check each sha256 against bench/datasets (off the CI spine; a cached file makes no network call)"
depends = ["setup"]
run = "bun scripts/bench/dataset-fetch.ts"

[tasks."bench:data:pin"]
description = "Rewrite bench/datasets/*.json from the cached files after a revision bump (off the CI spine)"
depends = ["setup"]
run = "bun scripts/bench/dataset-pin.ts"
