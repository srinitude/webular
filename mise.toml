# webular — universal task dependency graph (mise).
#
# Ordering note: the XState machines in src/machines/ model the CLI flows;
# their model-based tests (tests/machines/) walk every path against the real
# code. Tests are authored BEFORE code (R1).
#
# Graph shape (zero cycles — it is a tree rooted at `setup`):
#   setup -> lint -> typecheck -> build -> test -> validate -> ci
#   setup -> format                   (mutating dev task, OFF the check-only spine)
#   setup -> run:<command>            (one logical predecessor each)
# The CI/CD spine (setup..ci) is the SINGLE default dependency path and is
# check-only: `mise run ci` never mutates the working tree.
# The CLI never calls code directly: every subcommand/flag is routed as
#   `mise run run:<command> -- <args>`  (see bin/webular.ts).

min_version = "2026.5.18"

[tools]
bun = "1.4.3"

[vars]
# run:* runtime: a compiled webular passes its own path (with BUN_BE_BUN=1),
# so no second bun is needed; otherwise bun from PATH.
bun = "{{ get_env(name='WEBULAR_BUN', default='bun') }}"
# WEBULAR_DEV=1 runs commands straight from src/ (no build step); the default
# runs the minified dist/ bundles, which start with about half the CPU.
commands = "{% if get_env(name='WEBULAR_DEV', default='') != '' %}src{% else %}dist{% endif %}/commands"
ext = "{% if get_env(name='WEBULAR_DEV', default='') != '' %}ts{% else %}js{% endif %}"
# Listed, not globbed: the Windows task shell does not expand globs.
entries = '"{{config_root}}/src/commands/act.ts" "{{config_root}}/src/commands/answer.ts" "{{config_root}}/src/commands/audit.ts" "{{config_root}}/src/commands/batch.ts" "{{config_root}}/src/commands/crawl.ts" "{{config_root}}/src/commands/diagram.ts" "{{config_root}}/src/commands/doctor.ts" "{{config_root}}/src/commands/extract.ts" "{{config_root}}/src/commands/feed.ts" "{{config_root}}/src/commands/map.ts" "{{config_root}}/src/commands/mcp.ts" "{{config_root}}/src/commands/media.ts" "{{config_root}}/src/commands/monitor.ts" "{{config_root}}/src/commands/parse.ts" "{{config_root}}/src/commands/research.ts" "{{config_root}}/src/commands/scrape.ts" "{{config_root}}/src/commands/search.ts" "{{config_root}}/src/commands/summarize.ts" "{{config_root}}/src/commands/tasks.ts"'

# ───────────────────────── Quality / CI spine ─────────────────────────
# Single linear default dependency path. Each task depends on exactly one
# logical predecessor, making the whole pipeline deterministic.

[tasks.setup]
description = "Install pinned dependencies (frozen lockfile) — root of the universal task graph"
run = "bun install --frozen-lockfile 1>&2"
sources = ["package.json", "bun.lock"]
# OS-neutral marker: the .bin entry is biome.exe on Windows.
outputs = ["node_modules/@biomejs/biome/package.json"]

[tasks.format]
description = "Format + organize imports + safe-fix sources with Biome (mutating; off the CI spine)"
depends = ["setup"]
run = "bunx biome check --write ."

[tasks.lint]
description = "Lint + format-verify with Biome (check-only CI gate)"
depends = ["setup"]
run = "bunx biome check ."

[tasks.typecheck]
description = "Compilation: strict TypeScript typecheck"
depends = ["lint"]
run = "bunx tsc --noEmit"

[tasks.build]
description = "Build: bundle every command into dist/commands (shared chunks in dist/chunks) and compile the native webular executable into dist/bin"
depends = ["typecheck"]
run = [
  '''bun -e "require('node:fs').rmSync(process.argv[1], { recursive: true, force: true })" "{{config_root}}/dist"''',
  'bun build {{vars.entries}} --target=bun --minify --splitting --root="{{config_root}}/src" --outdir="{{config_root}}/dist" --chunk-naming=chunks/[name]-[hash].[ext]',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --outfile="{{config_root}}/dist/bin/webular"',
]
sources = ["src/**/*.ts", "bin/**/*.ts", "package.json", "tsconfig.json"]
outputs = ["dist/commands/search.js", "dist/bin/webular"]

[tasks."compile:all"]
description = "Cross-compile the webular executable for every Bun target into dist/bin (release path, off the check-only spine)"
depends = ["build"]
run = [
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-darwin-arm64 --outfile="{{config_root}}/dist/bin/webular-darwin-arm64"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-darwin-x64 --outfile="{{config_root}}/dist/bin/webular-darwin-x64"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-linux-x64 --outfile="{{config_root}}/dist/bin/webular-linux-x64"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-linux-arm64 --outfile="{{config_root}}/dist/bin/webular-linux-arm64"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-linux-x64-musl --outfile="{{config_root}}/dist/bin/webular-linux-x64-musl"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-linux-arm64-musl --outfile="{{config_root}}/dist/bin/webular-linux-arm64-musl"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-windows-x64 --outfile="{{config_root}}/dist/bin/webular-windows-x64.exe"',
  'bun build "{{config_root}}/bin/webular.ts" --compile --minify --sourcemap --bytecode --format=esm --target=bun-windows-arm64 --outfile="{{config_root}}/dist/bin/webular-windows-arm64.exe"',
]

[tasks.test]
description = "Run the bun test suite (CI/CD graph + contracts + integration)"
depends = ["build"]
run = "bun test --timeout 30000"

[tasks.validate]
description = "Validate gate — aggregates the full quality spine"
depends = ["test"]
run = "echo webular: validate OK"

[tasks.ci]
description = "CI entry — single default dependency path (local + remote)"
depends = ["validate"]
run = "echo webular: ci complete"

[tasks.clean]
description = "Remove build artifacts"
# Portable delete: `rm -rf` does not exist in the Windows task shell.
run = '''bun -e "require('node:fs').rmSync('dist', { recursive: true, force: true })"'''

# ───────────────────────── Capability commands ─────────────────────────
# Each is a Mastra workflow entrypoint. One logical predecessor (`setup`),
# branching off the root so command runs stay fast and deterministic
# without dragging the lint/typecheck spine into every invocation.

[tasks."run:search"]
description = "SEARCH — keyless web search (DuckDuckGo HTML + linkedom)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/search.{{vars.ext}}"'

[tasks."run:scrape"]
description = "SCRAPE — single URL to clean content (Bun.fetch + readability + turndown)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/scrape.{{vars.ext}}"'

[tasks."run:crawl"]
description = "CRAWL — recursive same-host traversal (Bun.fetch BFS + p-limit)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/crawl.{{vars.ext}}"'

[tasks."run:map"]
description = "MAP — URL discovery only (sitemap + link BFS via linkedom)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/map.{{vars.ext}}"'

[tasks."run:extract"]
description = "EXTRACT — structured/schema data (CSS selectors via linkedom + zod)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/extract.{{vars.ext}}"'

[tasks."run:summarize"]
description = "SUMMARIZE — extractive summary (no model)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/summarize.{{vars.ext}}"'

[tasks."run:answer"]
description = "ANSWER — grounded answer (search -> fetch -> synthesize)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/answer.{{vars.ext}}"'

[tasks."run:research"]
description = "RESEARCH — search -> fetch -> extractive synthesis (3-step Mastra workflow)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/research.{{vars.ext}}"'

[tasks."run:parse"]
description = "PARSE — documents to md/json (unpdf + mammoth + linkedom)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/parse.{{vars.ext}}"'

[tasks."run:media"]
description = "MEDIA — screenshot/pdf/download (agent-browser + streamed download)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/media.{{vars.ext}}"'

[tasks."run:monitor"]
description = "MONITOR — change tracking + scheduled monitors (diff + bun:sqlite)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/monitor.{{vars.ext}}"'

[tasks."run:batch"]
description = "BATCH — concurrent over many targets (p-limit)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/batch.{{vars.ext}}"'

[tasks."run:doctor"]
description = "DOCTOR — environment + toolchain diagnostics (clig.dev)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/doctor.{{vars.ext}}"'

[tasks."run:tasks"]
description = "TASKS — introspect the mise task graph this CLI routes through"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/tasks.{{vars.ext}}"'

[tasks."run:mcp"]
description = "MCP — expose webular capabilities as an MCP server"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/mcp.{{vars.ext}}"'

[tasks."run:diagram"]
description = "DIAGRAM — list the XState machines in src/machines"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/diagram.{{vars.ext}}"'

[tasks."run:audit"]
description = "AUDIT — deepsec vulnerability scan of composed tools"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/audit.{{vars.ext}}"'

[tasks."run:act"]
description = "ACT — drive a real browser (open/snapshot/screenshot/interact) via agent-browser"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/act.{{vars.ext}}"'

[tasks."run:feed"]
description = "FEED — read an RSS 2.0 or Atom 1.0 feed (fetch + linkedom XML)"
depends = ["setup"]
run = '"{{vars.bun}}" "{{config_root}}/{{vars.commands}}/feed.{{vars.ext}}"'

# ───────────────────────── Default + benchmark ─────────────────────────

[tasks.default]
description = "Default path: a bare `mise run` runs the whole CI spine"
depends = ["ci"]
run = "echo webular: default complete"

[tasks.bench]
description = "Benchmark cold start (wall + CPU) of the CLI and its network-free commands with hyperfine, then the summarizer scaling run at 10, 1,000 and 100,000 sentences (off the CI spine)"
depends = ["setup"]
run = """
command -v hyperfine >/dev/null || { echo 'bench: hyperfine not on PATH (brew install hyperfine)' >&2; exit 127; }
hyperfine -N --warmup 1 --runs ${BENCH_RUNS:-10} --style basic \
  -n help 'bun bin/webular.ts --help' \
  -n version 'bun bin/webular.ts --version' \
  -n tasks 'bun bin/webular.ts tasks --json' \
  -n doctor 'bun bin/webular.ts doctor --json' \
  -n diagram 'bun bin/webular.ts diagram --json' \
  -n summarize 'bun bin/webular.ts summarize --text "One. Two words here. Three." --json' \
  -n direct-diagram 'bun src/commands/diagram.ts --json' \
  -n direct-summarize 'bun src/commands/summarize.ts --text "One. Two." --json' \
  -n bundle-diagram 'bun dist/commands/diagram.js --json' \
  -n bundle-summarize 'bun dist/commands/summarize.js --text "One. Two." --json' \
  -n exe-help 'dist/bin/webular --help' \
  -n exe-version 'dist/bin/webular --version' \
  -n exe-diagram 'env BUN_BE_BUN=1 dist/bin/webular dist/commands/diagram.js --json' \
  -n exe-summarize 'env BUN_BE_BUN=1 dist/bin/webular dist/commands/summarize.js --text "One. Two." --json' \
  -n import-feed-workflow "bun -e 'await import(\\"./src/workflows/feed.ts\\")'" \
  -n import-mastra-workflows "bun -e 'await import(\\"@mastra/core/workflows\\")'" \
  -n bare-bun "bun -e 0"
bun tests/bench/complexity.ts
"""
